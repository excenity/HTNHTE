      "Authors@R": "c(person(\"Susan\", \"Gruber\", role = c(\"aut\", \"cre\"),  email = \"sgruber@cal.berkeley.edu\"), person(\"Mark\", \"van der Laan\", role = \"aut\", email = \"laan@berkeley.edu\"), person(\"Chris\", \"Kennedy\", role = \"ctr\", email = \"ck37@berkeley.edu\"))",
